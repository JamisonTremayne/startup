    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Hoarder</title>
    </head>
    <body>

        <header>
            <h1>PIXEL HOARDER</h1>
            <p>Welcome <span id="username">user</span>!</p>
            <nav>
                <h3>Menu</h3>
                <menu>
                    <li><a href="index.html">Logout</a></li>
                    <li><a href="social.html">Social</a></li>
            </nav>
            <hr />
            <p>You currently have <span id="pixel-count">0</span> pixels.</p>

        <main>
            <!-- Pixel Clicking Area -->
            <div id="canvas" style="width:500px; height:500px; border:1px solid black;"></div>
                 <label for="blue-pixel">Click the pixel: </label>
                 <button id="blue-pixel">
                    <svg width="50" height="50">
                        <rect x="0" y="0" width="50" height="50" fill="blue" />
                    </svg>
                </button>
            </div>
        </main>
        <footer>
