<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Hoarder Login</title>
        <link href="/src/index.css" rel="stylesheet">
        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="login.css" />
        <script type="module" src="/src/main.jsx"></script>
    </head>
    <body>

        <header>
            <img src="pixel_hoarder_title.png" alt="Pixel Hoarder Title" width="500"/>
            <hr />
        </header>

        <main>
            <div class="login-register">
                <h1>Login</h1>
                <form action="game.html" method="get">
                    <div>
                        <label for="username">Username:</label>
                        <input class="w-full px-4 py-2 rounded-lg bg-purple-900 text-white
                            border border-purple-600
                            focus:outline-none focus:ring-2 focus:ring-purple-400
                            placeholder-purple-300"
                            type="text" id="username" name="username" placeholder="Enter your username" required />
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input class="w-full px-4 py-2 rounded-lg bg-purple-900 text-white
                            border border-purple-600
                            focus:outline-none focus:ring-2 focus:ring-purple-400
                            placeholder-purple-300"
                            type="password" id="password" name="password" placeholder="Enter your password" required />
                    </div>
                    <div>
                        <button class="w-full mt-4 py-2 rounded-lg
                            bg-purple-600 hover:bg-purple-500
                            text-white font-semibold
                            transition duration-200
                            focus:outline-none focus:ring-2 focus:ring-purple-400"
                        type="submit">Login</button>
                    </div>
                </form>
            </div>
            <div class="login-options">
                <nav>
                    <ul>
                        <li><a href="register.html">Register an Account</a></li>
                        <li><a href="game.html">Play as Guest</a></li>
                        <li><a href="social.html">See Social Page</a></li>
                    </ul>
                </nav>
            </div>
        </main>
        <footer>
            <hr />
            <p>Author: Jamison Tremayne</p>
            <a href="https://github.com/JamisonTremayne/startup">Github Link</a>
        </footer>
    </body>
</html>
