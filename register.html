<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Hoarder Registration</title>
        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="login.css" />
        <script src="https://cdn.tailwindcss.com"></script> 
    </head>
    <body>

        <header>
            <img src="pixel_hoarder_title.png" alt="Pixel Hoarder Title" width="500"/>
            <hr />
        </header>

        <main>
            <div class="login-register">
                <h2>Register</h2>
                <form action="game.html" method="get">
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required />
                    </div>
                    <div>
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required />
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required />
                    </div>
                    <div>
                        <button type="submit">Register</button>
                    </div>
                </form>
            </div>
            <div class="login-options">
                <h3>Other Options</h3>
                <nav>
                    <ul>
                        <li>Already have an account? <a href="index.html">Login instead.</a></li>
                        <li><a href="game.html">Play as Guest</a></li>
                        <li><a href="social.html">See Social Page</a></li>
                    </ul>
                </nav>
            </div>
        </main>
        <footer>
            <hr />
            <p>Author: Jamison Tremayne</p>
            <a href="https://github.com/JamisonTremayne/startup">Github Link</a>
        </footer>
    </body>
</html>
