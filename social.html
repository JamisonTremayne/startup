<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Hoarder Social</title>
        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="social.css" />
    </head>
    <body>

        <header>
            <img src="pixel_hoarder_title.png" alt="Pixel Hoarder Title" width="500"/>
            <p>Welcome <span id="username">user</span>!</p>
            <nav class="bg-purple-800 text-white px-6 py-4">
                <ul class="flex gap-6 items-center">
                    <li>
                    <a href="index.html" class="hover:text-purple-300">Logout</a>
                    </li>
                    <li>
                    <a href="game.html" class="hover:text-purple-300">Return to Game</a>
                    </li>
                </ul>
            </nav>

            <hr />
        </header>

        <main>
            <section id="high-scores">
                <h2>High Scores</h2>
                <section id="grid-start">
                    <div class="grid row">
                        <div>1</div>
                        <div>Joe</div>
                        <div>8000 pixels</div>
                    </div>
                    <div class="grid row">
                        <div>2</div>
                        <div>Jo</div>
                        <div>4800 pixels</div>
                    </div>
                    <div class="grid row">
                        <div>3</div>
                        <div>Joh</div>
                        <div>4000 pixels</div>
                    </div>
                </section>
            </section>
        </main>
        <footer>
            <hr />
            <p>Author: Jamison Tremayne</p>
            <a href="https://github.com/JamisonTremayne/startup">Github Link</a>
        </footer>
    </body>
</html>
